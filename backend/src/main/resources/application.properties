# ============================================================
# Chaos Planner — Application Configuration
# ============================================================

# Server
server.port=${PORT:8080}
server.servlet.context-path=/

# ============================================================
# Database (PostgreSQL)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5433/chaos_planner
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# JWT Configuration
# ============================================================
app.jwt.secret=cGxhbm5lci1zZWNyZXQta2V5LWZvci1jaGFvcy1wbGFubmVyLWFwcC0yMDI2LXByb2R1Y3Rpb24=
app.jwt.expiration-ms=86400000

# ============================================================
# Admin Registration Configuration
# ============================================================
app.admin.secret-code=${ADMIN_SECRET_CODE:CHAOS_ADMIN_2026}

# ============================================================
# OTP Configuration
# ============================================================
app.otp.expiry-minutes=10
app.otp.length=6
# Resend cooldown in seconds (default: 60)
app.otp.resend-cooldown-seconds=60
# Max verify attempts before OTP is invalidated
app.otp.max-attempts=5

# ============================================================
# SMTP Mail Configuration (environment variable driven)
# Set these via environment variables or .env.local
# Required env vars:
#   SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, MAIL_FROM
# ============================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:nakkasohankumar@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:ntoi zqjr zodu pxus}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Mail from address (display name)
app.mail.from=nakkasohankumar@gmail.com
app.mail.from-name=Chaos Planner

# ============================================================
# SpringDoc / Swagger UI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================================
# File Upload
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# Logging — NOTE: OTP codes are NEVER logged
# ============================================================
logging.level.com.chaosplanner=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.mail=WARN
